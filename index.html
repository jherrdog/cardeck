<div class="shell" id="shell">
  <aside class="side" id="side" aria-label="Boxes">
    <a class="brand" href="#/" aria-label="CARDECK desk"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">CARDECK</span></a>
    <nav class="nav" id="nav-main"></nav>
    <nav class="nav" id="nav-boxes" aria-label="Boxes"></nav>
    <nav class="nav" id="nav-projects" aria-label="Projects"></nav>
    <div class="side-foot">
      <button class="sync" id="sync" data-state="local" title="Sync now"><span class="sync-dot"></span><span id="sync-text">This device</span></button>
      <button class="icon-btn" id="open-settings" aria-label="Settings"><svg class="ico"><use href="#i-gear"/></svg></button>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open boxes"><svg class="ico"><use href="#i-menu"/></svg></button>
      <div class="search" role="search">
        <svg class="ico"><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="Search your cards" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Search your cards" enterkeyhint="search">
        <kbd>/</kbd>
        <button class="search-clear" id="q-clear" aria-label="Clear search" hidden><svg class="ico"><use href="#i-x"/></svg></button>
      </div>
      <button class="btn coach-btn" id="coach-btn" aria-pressed="false" title="Writing coach (c)"><svg class="ico"><use href="#i-spark"/></svg><span>Coach</span></button>
      <button class="btn btn-primary new-btn" id="new-btn"><svg class="ico"><use href="#i-plus"/></svg>New card</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<button class="fab" id="fab" aria-label="New card"><svg class="ico"><use href="#i-plus"/></svg></button>

<aside class="coach" id="coach" hidden aria-label="Writing coach"></aside>
<div class="scrim" id="scrim" hidden></div>
<section class="reader" id="reader" hidden tabindex="-1" aria-modal="true" role="dialog" aria-label="Card"></section>
<div class="dock" id="dock" hidden></div>
<aside class="panel" id="panel" hidden aria-modal="true" role="dialog"></aside>
<div class="dialog" id="dialog" hidden role="alertdialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-in" class="sr" accept=".json,application/json,text/plain">

<script src="app.js"></script>
</body>
</html>
